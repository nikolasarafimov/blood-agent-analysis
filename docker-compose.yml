services:
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9090}:9090"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:latest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BRONZE_BUCKET: ${MINIO_BRONZE_BUCKET:-bronze}
      MINIO_SILVER_BUCKET: ${MINIO_SILVER_BUCKET:-silver}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BRONZE_BUCKET"
        mc mb --ignore-existing "local/$$MINIO_SILVER_BUCKET"
        echo "MinIO buckets ready"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: blood-agent-api/Dockerfile
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_SECURE: "false"
      MINIO_BRONZE_BUCKET: ${MINIO_BRONZE_BUCKET:-bronze}
      MINIO_SILVER_BUCKET: ${MINIO_SILVER_BUCKET:-silver}

      SQLITE_DB_PATH: /data/bronze.sqlite3

      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}

      ENABLE_LLM_OCR: ${ENABLE_LLM_OCR:-false}
      ALLOW_UNREDACTED_LLM_OCR: ${ALLOW_UNREDACTED_LLM_OCR:-false}
      ENABLE_LLM_ANONYMIZATION: ${ENABLE_LLM_ANONYMIZATION:-false}

      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}

      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_UPLOAD_FILES: ${MAX_UPLOAD_FILES:-5}
      MAX_PROMPT_CHARS: ${MAX_PROMPT_CHARS:-10000}
      MAX_EDIT_TEXT_MB: ${MAX_EDIT_TEXT_MB:-8}
      MAX_DOCUMENT_PAGES: ${MAX_DOCUMENT_PAGES:-30}
      MAX_OCR_IMAGE_PIXELS: ${MAX_OCR_IMAGE_PIXELS:-40000000}
      MAX_STORAGE_READ_MB: ${MAX_STORAGE_READ_MB:-32}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-60}
      PDF_RENDER_TIMEOUT_SECONDS: ${PDF_RENDER_TIMEOUT_SECONDS:-60}
      OCRMYPDF_TIMEOUT_SECONDS: ${OCRMYPDF_TIMEOUT_SECONDS:-300}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    volumes:
      - sqlite-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8000/health > /dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ui:
    build:
      context: ./blood-agent-ui
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
        REACT_APP_OCR_LANGUAGE: ${REACT_APP_OCR_LANGUAGE:-mkd+eng}
        REACT_APP_PERSIST_SESSIONS: ${REACT_APP_PERSIST_SESSIONS:-false}
    ports:
      - "127.0.0.1:${UI_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  minio-data:
  sqlite-data: